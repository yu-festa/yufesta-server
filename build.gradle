plugins {
	id 'java'
	id 'org.springframework.boot' version '4.1.1'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(17)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-security-oauth2-client'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	implementation 'org.springframework.boot:spring-boot-starter-flyway'
	implementation 'org.flywaydb:flyway-mysql'
	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.0.3'
	// 이미지 저장소(S3)와 리사이즈. AWS SDK는 Boot BOM 밖이라 자체 BOM으로 버전을 맞춘다. 동기 클라이언트만 쓰므로 netty는 제외
	implementation platform('software.amazon.awssdk:bom:2.55.4')
	implementation('software.amazon.awssdk:s3') {
		exclude group: 'software.amazon.awssdk', module: 'netty-nio-client'
	}
	implementation 'net.coobird:thumbnailator:0.4.21'
	// 응답 캐시(부하 테스트에서 앱 CPU가 천장이었고 직렬화된 응답을 캐시해 그 경로를 건너뛴다). Lettuce 기본 사용
	implementation 'org.springframework.boot:spring-boot-starter-data-redis'
	// 인증 필터의 회원 역할 조회를 태스크 메모리에 60초 기억한다(로그인 요청마다 DB를 읽지 않게). 버전은 Boot BOM 관리
	implementation 'com.github.ben-manes.caffeine:caffeine'
	runtimeOnly 'com.mysql:mysql-connector-j'
	compileOnly 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok'
	testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-security-oauth2-client-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-security-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testRuntimeOnly 'com.h2database:h2'
	testCompileOnly 'org.projectlombok:lombok'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	testAnnotationProcessor 'org.projectlombok:lombok'
}

tasks.named('test') {
	useJUnitPlatform()
}

tasks.register('moderationEvaluation', JavaExec) {
	group = 'verification'
	description = 'Runs the private moderation dataset and writes an aggregate report without source text.'
	classpath = sourceSets.test.runtimeClasspath
	mainClass = 'com.yufesta.domain.moderation.evaluation.ModerationEvaluationRunner'

	def dataset = providers.gradleProperty('moderationDataset')
	def report = providers.gradleProperty('moderationReport')
			.orElse(layout.buildDirectory.file('reports/moderation/evaluation.json').map { it.asFile.absolutePath })
	doFirst {
		if (!dataset.present) {
			throw new GradleException('-PmoderationDataset=<private-jsonl-path> is required')
		}
		args = [dataset.get(), report.get()]
	}
}
