# ALB가 TLS를 종료하고 HTTP로 전달하므로 X-Forwarded-Proto/Host로 https 기준 URL(OAuth redirect-uri 등)을 만든다.
# 태스크는 ALB 보안 그룹에서만 접근되므로 헤더 위조 경로가 없다. dev에는 두지 않는다
server:
  forward-headers-strategy: framework

spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      # 부하 테스트(2026-09-25)에서 기본값 10이 처리량 상한이었다. 발표 직후 1,000명 구간에서
      # CPU 26%·힙 여유인데 커넥션 대기가 189개까지 쌓였다(load/README.md 참고).
      # RDS db.t4g.micro의 max_connections는 약 85라 2태스크 × 20 = 40이면 여유가 있다
      maximum-pool-size: ${DB_POOL_SIZE:20}
      # 롤링 배포 중에는 구·신 태스크가 함께 떠 최대 4개가 된다. HikariCP는 minimum-idle 기본값이
      # maximum-pool-size라 한가할 때도 태스크당 20개를 붙들어 4 × 20 = 80으로 max_connections(약 85)에 닿는다.
      # 유휴 보유를 낮추면 부하가 있는 태스크만 20까지 늘린다
      minimum-idle: ${DB_POOL_MIN_IDLE:5}

  jpa:
    hibernate:
      ddl-auto: validate

  security:
    oauth2:
      client:
        registration:
          kakao:
            client-id: ${KAKAO_CLIENT_ID}
            client-secret: ${KAKAO_CLIENT_SECRET:}
            client-authentication-method: client_secret_post
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            client-name: Kakao
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            scope: openid
        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id

# 운영 Swagger는 프론트 연동 기간에만 켠다(Terraform swagger_enabled). 축제 전 false로 apply
springdoc:
  api-docs:
    enabled: ${SWAGGER_ENABLED:false}
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:false}
    csrf:
      enabled: true
      cookie-name: XSRF-TOKEN
      header-name: X-XSRF-TOKEN

app:
  auth:
    frontend-url: ${FRONTEND_URL}
    allowed-origins: ${ALLOWED_ORIGINS:}
    jwt:
      secret: ${JWT_SECRET}
      access-token-validity: ${JWT_ACCESS_TOKEN_VALIDITY:PT2H}
    cookie:
      name: access_token
      secure: true
      domain: ${AUTH_COOKIE_DOMAIN:}
