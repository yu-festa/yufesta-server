spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/yufesta?serverTimezone=Asia/Seoul&characterEncoding=UTF-8}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}

  jpa:
    hibernate:
      # 스키마는 Flyway(db/migration)가 만든다. 엔티티와 어긋나면 기동 실패
      ddl-auto: validate

  security:
    oauth2:
      client:
        registration:
          kakao:
            client-id: ${KAKAO_CLIENT_ID}
            client-secret: ${KAKAO_CLIENT_SECRET:}
            client-authentication-method: client_secret_post
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            client-name: Kakao
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            scope: openid
        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
    # Try it out가 XSRF-TOKEN 쿠키를 읽어 X-XSRF-TOKEN 헤더로 보내게 한다(쓰기 API 테스트용)
    csrf:
      enabled: true
      cookie-name: XSRF-TOKEN
      header-name: X-XSRF-TOKEN

app:
  auth:
    frontend-url: ${FRONTEND_URL:http://localhost:3000}
    jwt:
      secret: ${JWT_SECRET}
      access-token-validity: ${JWT_ACCESS_TOKEN_VALIDITY:PT2H}
    cookie:
      name: access_token
      secure: false
      domain: ${AUTH_COOKIE_DOMAIN:}
