spring:
  application:
    name: yufesta

  profiles:
    default: dev

  jpa:
    open-in-view: false
    properties:
      hibernate:
        # ERD의 TINYINT(1)과 맞춘다. 기본값 bit이면 validate 전환 때 불리언 컬럼이 전부 어긋난다
        type:
          preferred_boolean_jdbc_type: TINYINT

app:
  scheduler:
    # 회차 자동 오픈·마감·발표(RoundScheduler). 수동 API로만 확인하려면 false
    enabled: ${SCHEDULER_ENABLED:true}
    round-tick: PT10S

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
