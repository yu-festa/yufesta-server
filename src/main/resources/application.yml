spring:
  application:
    name: yufesta

  profiles:
    default: dev

  data:
    redis:
      # 로컬은 compose의 redis, 운영은 ElastiCache 주소를 Terraform이 넣는다.
      # 캐시가 죽어도 앱은 DB 경로로 동작하므로 기동을 막지 않는다(ResponseCache가 예외를 먹는다)
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 200ms          # 캐시를 기다리다 본 요청이 느려지면 안 된다. 짧게 끊고 DB로 간다
      connect-timeout: 500ms
      # Lettuce는 커넥션 하나를 여러 스레드가 공유하며 명령을 파이프라인으로 보낸다(스레드 안전).
      # 풀을 켜면 commons-pool2 의존성이 더 필요하고, 우리 사용 패턴(짧은 GET/SET)에서는 이득이 없다
      lettuce:
        pool:
          enabled: false

  servlet:
    multipart:
      # 사진 업로드 장당 10MB(FR-PH-05). 초과는 MaxUploadSizeExceededException → PHOTO_TOO_LARGE(413)
      max-file-size: 10MB
      max-request-size: 12MB

  jpa:
    open-in-view: false
    # 부울 컬럼은 ERD의 TINYINT(1). MySQL 드라이버가 TINYINT(1)을 BIT로 보고하므로(tinyInt1isBit 기본 true)
    # Hibernate 기본 부울 타입(BIT)이 validate와 맞는다. preferred_boolean_jdbc_type=TINYINT를 주면 오히려 어긋난다.
    # JDBC URL에 tinyInt1isBit=false를 넣지 말 것

app:
  scheduler:
    # 회차 자동 오픈·마감·발표(RoundScheduler). 수동 API로만 확인하려면 false
    enabled: ${SCHEDULER_ENABLED:true}
    round-tick: PT10S
  cache:
    # 응답 캐시 전역 스위치. 문제가 생기면 이 값만 false로 바꿔 즉시 DB 경로로 되돌린다
    enabled: ${CACHE_ENABLED:true}
    # 키 앞에 붙는 버전. 응답 형태가 바뀌는 배포에서 이 값을 올리면 옛 캐시를 한 번에 버린다
    version: v1
    # 신선 기간이 지난 뒤 "낡았지만 쓸 수 있는" 구간. 재계산 권한을 쥔 요청이 끝날 시간만 주면 되므로
    # 락 제한(3초)보다 넉넉한 10초로 충분하다. 이 값이 곧 최악의 낡음(신선 기간 + 10초)을 정한다.
    # 타임테이블 응답에는 serverNow와 isLive가 들어가므로 이 상한을 짧게 유지하는 것이 중요하다
    stale-window: 10s
  storage:
    # 이미지 저장소. local(기본, ./uploads에 저장하고 /uploads/**로 서빙) | s3(운영, 태스크 역할 자격 증명)
    type: ${IMAGE_STORAGE:local}
    # 응답 photoUrl의 접두. 운영은 CloudFront 도메인(Terraform image_cdn_url)
    cdn-url: ${IMAGE_CDN_URL:http://localhost:8080/uploads}
    s3:
      bucket: ${IMAGE_BUCKET:}
      region: ${AWS_REGION:ap-northeast-2}
    local:
      dir: ${IMAGE_LOCAL_DIR:./uploads}

# 로그 한 줄마다 [req=요청ID user=회원ID]. RequestLoggingFilter가 MDC에 넣는다(NFR-SC-05)
logging:
  pattern:
    level: "%5p [req=%X{requestId:--} user=%X{userId:--}]"

server:
  tomcat:
    mbeanregistry:
      # tomcat.threads.busy 같은 스레드 풀 지표를 액추에이터가 읽으려면 필요하다(부하 테스트 병목 판독용)
      enabled: true

management:
  endpoints:
    web:
      exposure:
        # metrics는 운영자(OWNER)만 볼 수 있다(SecurityConfig). 부하 테스트 중 Hikari·Tomcat·JVM 지표 수집에 쓴다
        include: health,info,metrics
  endpoint:
    health:
      show-details: never
  health:
    redis:
      # 캐시가 죽어도 앱은 DB 경로로 정상 동작한다(ResponseCache가 예외를 먹는다).
      # 그런데 Redis 헬스 지표를 켜 두면 캐시 장애가 헬스 DOWN → ALB가 태스크 전부 제외 → 전면 장애로 번진다.
      # 캐시는 가용성 의존 대상이 아니므로 헬스 판정에서 제외한다
      enabled: false
