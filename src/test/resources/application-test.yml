spring:
  datasource:
    url: jdbc:h2:mem:yufesta;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: create-drop

  # 마이그레이션은 MySQL 문법이라 H2에서는 Hibernate가 스키마를 만든다
  flyway:
    enabled: false

  security:
    oauth2:
      client:
        registration:
          kakao:
            client-id: test-kakao-client-id
            client-secret: test-kakao-client-secret
            client-authentication-method: client_secret_post
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            client-name: Kakao
          google:
            client-id: test-google-client-id
            client-secret: test-google-client-secret
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            scope: openid
        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id

app:
  scheduler:
    enabled: false
  auth:
    frontend-url: http://localhost:3000
    jwt:
      secret: test-secret-must-be-at-least-32-bytes-long
      access-token-validity: PT2H
    cookie:
      name: access_token
      secure: false
      domain:
